<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Valentine</title>

  <!-- Pixel-style font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(#5c94fc, #87ceeb);
      font-family: 'Press Start 2P', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: #fff3cd;
      padding: 40px;
      border: 6px solid #000;
      box-shadow: 8px 8px 0 #000;
    }

    h1 {
      color: #d62828;
      font-size: 18px;
      margin-bottom: 40px;
    }

    button {
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      padding: 15px 25px;
      margin: 10px;
      border: 4px solid black;
      cursor: pointer;
      position: relative;
    }

    #yesBtn {
      background: #2ecc71;
      /* nudge YES a bit to the left for better alignment */
      left: -30px;
    }

    #noBtn {
      background: #e74c3c;
      position: absolute;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 120%;
      height: 100px;
      background: #8b4513;
      border-top: 6px solid black;
    }

    /* Hover counter styling */
    .hover-counter {
      position: fixed;
      top: 50px;
      right: 100px;
      background: #fff;
      border: 4px solid #000;
      padding: 12px 16px;
      font-family: 'Press Start 2P', cursive;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      box-shadow: 10px 10px 0 #000;
      border-radius: 12px;
      min-width: 88px;
      justify-content: center;
    }

    /* layout wrapper to stack container and click text vertically */
    .center-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Randomness click text */
    .random-text {
      margin-top: 14px;
      font-size: 14px;
      color: #000;
      text-decoration: underline;
      cursor: pointer;
      display: inline;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      font-family: 'Press Start 2P', cursive;
      line-height: 1.2;
    }

    .random-text.flash {
      animation: random-flash 220ms ease;
    }

    @keyframes random-flash {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .hover-counter .coin {
      display: inline-block;
      transform-origin: center;
      font-size: 22px;
      line-height: 1;
    }

    .hover-counter #hoverCountValue {
      font-size: 18px;
      font-weight: 700;
      display: inline-block;
      min-width: 28px;
      text-align: center;
    }

    .hover-counter .pulse {
      animation: hover-pop 300ms ease;
    }

    @keyframes hover-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.45); }
      100% { transform: scale(1); }
    }

    /* simple centered plain 'Click here' text */
    .click-text {
      margin: 12px auto 0 auto;
      font-size: 14px;
      color: #000;
      text-decoration: underline;
      cursor: default;
      display: block;
      text-align: center;
      font-family: 'Press Start 2P', cursive;
      width: fit-content;
    }
  </style>
</head>
<body>

  <div class="center-column">
    <div class="container">
      <h1>Will you be my valentine?</h1>
      <button id="yesBtn" onclick="sayYes()">YES</button>
      <button id="noBtn">NO</button>
    </div>

    <br>
    <!-- Simple centered 'Click here' text requested -->
    <div id="clickHere" class="click-text">Click here! ❤️</div>
  </div>

    <!-- Fixed hover counter in the top-right with a coin icon -->
    <div id="hoverCounter" class="hover-counter">
      <span class="coin">🪙</span>
      <span id="hoverCountValue">0</span>
    </div>

  <div class="ground"></div>

  <script>
  const noBtn = document.getElementById("noBtn");
  const hoverCounterText = document.getElementById('hoverCountValue');
  const hoverCoinEl = document.querySelector('.hover-counter .coin');
  let hoverCount = 0;
  const randomText = document.getElementById('randomText');

    function moveButton() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Audio handling: create/resume an AudioContext on first user gesture and reuse it
    let audioCtx = null;

    // Initialize audio context on first user interaction (pointerdown/click) to satisfy
    // browsers' autoplay/user-gesture policies.
    document.addEventListener('pointerdown', () => {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
        } catch (e) {
          console.warn('AudioContext creation failed:', e);
          audioCtx = null;
        }
      }
    }, { once: true });

    function playCoinSound() {
      // If the audio context hasn't been initialized (no prior user gesture), don't try.
      if (!audioCtx) return;
      try {
        const ctx = audioCtx;
        const now = ctx.currentTime;

        // two oscillators for a richer metallic sound
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc1.type = 'triangle';
        osc2.type = 'square';

        // starting frequencies
        osc1.frequency.setValueAtTime(900, now);
        osc2.frequency.setValueAtTime(1400, now);

        // quick upward sweep to make the 'ping' characteristic
        osc1.frequency.exponentialRampToValueAtTime(1800, now + 0.08);
        osc2.frequency.exponentialRampToValueAtTime(2200, now + 0.08);

        // light highpass to remove low rumble
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(400, now);

        // amplitude envelope
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.8, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.35);
        osc2.stop(now + 0.35);

        // do not close the shared audio context; reuse for subsequent sounds
      } catch (e) {
        console.warn('Audio playback failed or blocked:', e);
      }
    }

    // Use mouseenter to reduce repeated bubbling triggers and ensure hover feels responsive.
    noBtn.addEventListener("mouseenter", () => {
      moveButton();
      playCoinSound();
      // increment hover counter and update UI
      hoverCount += 1;
      if (hoverCounterText) hoverCounterText.textContent = hoverCount;
      // animate coin
      if (hoverCoinEl) {
        hoverCoinEl.classList.remove('pulse');
        // trigger reflow to restart animation
        // eslint-disable-next-line no-unused-expressions
        hoverCoinEl.offsetWidth;
        hoverCoinEl.classList.add('pulse');
      }
    });

    // Clickable randomness text: move button and play coin sound
    if (randomText) {
      randomText.addEventListener('click', () => {
        // user click counts as a gesture; ensure audioCtx is created/resumed
        if (audioCtx && audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
        moveButton();
        playCoinSound();
        // flash animation on the text
        randomText.classList.remove('flash');
        // trigger reflow
        // eslint-disable-next-line no-unused-expressions
        randomText.offsetWidth;
        randomText.classList.add('flash');
      });
    }

    // Winning sound for the YES button: a small chime/arpeggio
    function playWinSound() {
      if (!audioCtx) return; // audioCtx will be initialized on first user gesture
      try {
        const ctx = audioCtx;
        const now = ctx.currentTime;

        const masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(0.001, now);
        masterGain.gain.exponentialRampToValueAtTime(0.9, now + 0.02);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        masterGain.connect(ctx.destination);

        // Create a bright bell-like sound using two detuned oscillators
        const oscA = ctx.createOscillator();
        const oscB = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();

        oscA.type = 'sine';
        oscB.type = 'triangle';
        oscB.detune.value = 10; // slight detune for chorus

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3000, now);

        oscA.connect(filter);
        oscB.connect(filter);
        filter.connect(masterGain);

        // Arpeggiated notes (C5, E5, G5, C6)
        const notes = [523.25, 659.25, 783.99, 1046.50];

        // Start oscillator and ramp frequency across notes
        oscA.frequency.setValueAtTime(notes[0], now);
        oscB.frequency.setValueAtTime(notes[0], now);
        oscA.start(now);
        oscB.start(now);

        oscA.frequency.linearRampToValueAtTime(notes[1], now + 0.18);
        oscB.frequency.linearRampToValueAtTime(notes[1], now + 0.18);
        oscA.frequency.linearRampToValueAtTime(notes[2], now + 0.38);
        oscB.frequency.linearRampToValueAtTime(notes[2], now + 0.38);
        oscA.frequency.linearRampToValueAtTime(notes[3], now + 0.78);
        oscB.frequency.linearRampToValueAtTime(notes[3], now + 0.78);

        // Stop after the envelope
        oscA.stop(now + 1.05);
        oscB.stop(now + 1.05);
      } catch (e) {
        console.warn('Win sound playback failed or blocked:', e);
      }
    }

    function sayYes() {
      playWinSound();

      document.body.innerHTML = `
        <div style="
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          height:100vh;
          font-family:'Press Start 2P';
          background:#5c94fc;
          color:white;
          text-align:center;
          gap:20px;
        ">
          <div style="display:flex;align-items:center;gap:20px;">
            <!-- Attempt to load local images named mario.png and peach.png in the same folder. -->
            <img id="marioImg" src="removebg-preview.png" alt="Mario" style="width:140px;height:auto;border:6px solid #000;box-shadow:6px 6px 0 #000;" onerror="this.style.display='none'">
            <div id="fallbackChars" style="font-size:48px;display:flex;align-items:center;gap:12px;">
              
            </div>
        
          </div>
          <h1>Yaaayyyy!! ❤️🍄</h1>
        </div>
      `;

      // If one or both images load successfully, hide the emoji fallback.
      // Use a tiny timeout to allow the browser to attempt image loads.
      setTimeout(() => {
        const m = document.getElementById('marioImg');
        const p = document.getElementById('peachImg');
        const fallback = document.getElementById('fallbackChars');
        if ((m && m.complete && m.naturalWidth > 0) || (p && p.complete && p.naturalWidth > 0)) {
          if (fallback) fallback.style.display = 'none';
        }
      }, 100);
    }
  </script>

</body>
</html>
