 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Valentine</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(#5c94fc, #87ceeb);
      font-family: 'Press Start 2P', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: #fff3cd;
      padding: 40px;
      border: 6px solid #000;
      box-shadow: 8px 8px 0 #000;
    }

    h1 {
      color: #d62828;
      font-size: 18px;
      margin-bottom: 40px;
    }

    button {
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      padding: 15px 25px;
      margin: 10px;
      border: 4px solid black;
      cursor: pointer;
      position: relative;
    }

    #yesBtn {
      background: #2ecc71;
      left: -30px;
    }

    #noBtn {
      background: #e74c3c;
      position: absolute;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 120%;
      height: 100px;
      background: #8b4513;
      border-top: 6px solid black;
    }

    .hover-counter {
      position: fixed;
      top: 50px;
      right: 100px;
      background: #fff;
      border: 4px solid #000;
      padding: 12px 16px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      box-shadow: 10px 10px 0 #000;
      border-radius: 12px;
    }

    .center-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .click-text {
      margin-top: 12px;
      font-size: 14px;
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="center-column">
  <div class="container">
    <h1>Will you be my valentine?</h1>
    <button id="yesBtn" onclick="sayYes()">YES</button>
    <button id="noBtn" onclick="sayNo()">NO</button>
  </div>

  <div class="click-text">Click here! ❤️</div>
</div>

<div id="hoverCounter" class="hover-counter">
  🪙 <span id="hoverCountValue">0</span>
</div>

<div class="ground"></div>

<script>
const noBtn = document.getElementById("noBtn");
let hoverCount = 0;

// Move NO button randomly
function moveButton() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// Hover = escape 😆
noBtn.addEventListener("mouseenter", () => {
  moveButton();
  hoverCount++;
  document.getElementById("hoverCountValue").textContent = hoverCount;
});

// YES clicked 😈
function sayYes() {
  document.body.innerHTML = `
    <div style="
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:'Press Start 2P';
      background:#5c94fc;
      color:white;
      text-align:center;
      padding:20px;
      gap:20px;
    ">
      <h1 style="font-size:18px; line-height:1.6;">
        No 🥀<br><br>
        I can't be your valentine 💔<br><br>
        I am your class teacher 📚👩‍🏫
      </h1>

      <button onclick="location.reload()" style="
        padding:12px 20px;
        border:4px solid black;
        background:#f1c40f;
        font-family:'Press Start 2P';
        cursor:pointer;
      ">
        Try Again
      </button>
    </div>
  `;
}

// NO clicked 💔
function sayNo() {
  document.body.innerHTML = `
    <div style="
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:'Press Start 2P';
      background:#1e1e1e;
      color:white;
      text-align:center;
      gap:20px;
      padding:20px;
    ">
      <div style="font-size:70px;">💔</div>

      <h1 style="font-size:18px;">
        You broke my heart...
      </h1>

      <button onclick="location.reload()" style="
        padding:12px 20px;
        border:4px solid black;
        background:#e74c3c;
        font-family:'Press Start 2P';
        cursor:pointer;
      ">
        Try Again
      </button>
    </div>
  `;
}
</script>

</body>
  </html>
